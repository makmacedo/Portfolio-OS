<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="system.title">Arc OS – Portfolio Desktop</title>
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="tailwind.config.js"></script>
    <link rel="stylesheet" href="styles.css?v=20261027-2" />
</head>

<body class="h-full select-none bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-slate-100">
    <!-- Boot Screen -->
    <div id="boot-screen" class="fixed inset-0 z-[100000] bg-black flex flex-col justify-center items-start px-8 font-mono text-green-400">
        <div id="boot-messages" class="space-y-1 text-sm"></div>
        <div id="boot-cursor" class="inline-block w-2 h-5 mt-1 bg-green-400 animate-pulse"></div>
    </div>

    <!-- Desktop -->
    <div id="desktop" class="relative w-full h-full opacity-0">
        <!-- Desktop wallpaper overlay (subtle grid) -->
        <div class="absolute inset-0 pointer-events-none opacity-20 desktop-grid">
        </div>

        <!-- Desktop icons -->
        <div id="desktop-icons" class="absolute inset-0 p-4 opacity-0">
            <!-- Icons injected by JS -->
        </div>

        <!-- Start menu -->
        <div id="start-menu" class="absolute z-50 hidden overflow-hidden border left-2 bottom-14 w-80 bg-slate-900/95 border-slate-700 rounded-xl backdrop-blur-xl">
            <div class="flex items-center gap-3 p-3 border-b border-slate-700 bg-slate-800/60">
                <div id="start-user-avatar" class="grid w-10 h-10 font-bold rounded-lg bg-brand-600 place-items-center">AM</div>
                <div class="leading-tight">
                    <div id="start-user-name" class="font-semibold">Arcadio Macedo</div>
                    <div id="start-user-subtitle" class="text-xs text-slate-400">Web Developer</div>
                </div>
            </div>
            <div class="overflow-auto max-h-96">
                <ul id="start-list" class="p-2 text-sm">
                    <!-- Populated by JS -->
                </ul>
            </div>
            <div class="flex gap-2 p-2 border-t border-slate-700">
                <button id="settings-btn" class="px-3 py-1 text-xs rounded bg-slate-700 hover:bg-slate-600" data-i18n="system.settings">
                    <!-- ⚙️ Settings -->
                </button>
                <button id="lock-desktop" class="px-3 py-1 text-xs rounded bg-slate-700 hover:bg-slate-600" data-i18n="system.lock">
                    <!-- 🔒 Lock -->
                </button>
            </div>
        </div>

        <!-- Taskbar -->
        <div class="absolute bottom-0 left-0 right-0 flex items-center h-12 gap-2 px-2 translate-y-full border-t opacity-0 bg-slate-950/70 border-slate-700 backdrop-blur-xl" id="taskbar-container">
            <button id="start-btn" class="px-3 font-medium rounded-lg h-9 bg-brand-600 hover:bg-brand-500" data-i18n="system.start">
                <!-- Start -->
            </button>
            <div id="taskbar" class="flex items-center flex-1 gap-2 overflow-x-auto"></div>
            <div id="clock" class="px-2 py-1 text-sm rounded tabular-nums bg-slate-800/70"></div>
        </div>

    </div> 
    <!-- Templates -->
    <template id="icon-tpl">
        <button class="grid w-20 gap-2 text-xs text-center icon aspect-square place-items-center text-slate-200/90 hover:text-white" draggable="false">
            <div class="grid w-12 h-12 text-2xl rounded-xl bg-slate-700/50 place-items-center"></div>
            <span class="line-clamp-2"></span>
        </button>
    </template>
    <template id="window-tpl">
        <div class="win absolute top-24 left-24 w-[640px] h-[420px] bg-slate-900/95 border border-slate-700 rounded-xl overflow-hidden">
            <div class="flex items-center justify-between h-10 px-2 border-b cursor-move titlebar group bg-slate-800/70 border-slate-700">
                <div class="ml-3 text-sm font-medium" data-role="title"></div>
                <div class="flex items-center gap-2">
                    <div class="text-xs text-slate-400" data-role="status"></div>
                    <div class="flex items-center gap-2 ml-4">
                        <div class="window-btn window-btn-min" data-act="min" data-i18n-title="system.minimize" title=""></div>
                        <div class="window-btn window-btn-max" data-act="max" data-i18n-title="system.maximize" title=""></div>
                        <div class="window-btn window-btn-close" data-act="close" data-i18n-title="system.close" title=""></div>
                    </div>
                </div>
            </div>
            <div class="content relative w-full h-[calc(100%-2.5rem)] bg-slate-900/60"></div>
            <div class="resize-handle"></div>
        </div>
    </template>
    <template id="taskbtn-tpl">
        <button class="px-3 text-sm transition-all duration-200 border-2 border-transparent rounded-lg task h-9 bg-slate-800/60 hover:bg-slate-700 whitespace-nowrap"></button>
    </template>

    <!-- Core System Scripts -->
    <script src="kernel.js"></script>
    
    <!-- Modular System Components -->
    <script src="modules/profile.js"></script>
    <script src="modules/app.js"></script>
    <script src="modules/wallpaper.js"></script>
    <script src="modules/window.js"></script>
    <script src="modules/boot.js"></script>
    <script src="modules/login.js"></script>
    
    <!-- Main Application Script -->
    <script src="script.js"></script>
</body>

</html>
